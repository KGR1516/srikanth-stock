name: Daily Breakout Screener

on:
  schedule:
    # GitHub Actions cron runs in UTC (IST = UTC + 5:30)
    - cron: '30 5 * * 1-5'   # 11:00 AM IST, Mon-Fri
    - cron: '15 9 * * 1-5'   # 2:45 PM IST, Mon-Fri
  workflow_dispatch: {}

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py --all-nse

      - name: Email results
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py
